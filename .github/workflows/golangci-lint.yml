name: golangci-lint
on:
  pull_request:
  push:
    branches: [master, dev]
permissions:
  contents: read
  # Optional: allow read access to pull request. Use with `only-new-issues` option.
  pull-requests: read

env:
  GOPRIVATE: github.com/InjectiveLabs
  GONOSUMDB: github.com/InjectiveLabs

jobs:
  golangci:
    name: lint
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: false
      - name: Download Go modules
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: ./scripts/with-private-git.sh go mod download
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Optional: version of golangci-lint to use in form of v1.2 or v1.2.3 or `latest` to use the latest version
          version: v2.15.0

          # Optional: working directory, useful for monorepos
          # working-directory: somedir

          # Optional: golangci-lint command line arguments.
          args: --timeout=15m -v

          # Optional: show only new issues if it's a pull request. The default value is `false`.
          only-new-issues: true

          # Optional: if set to true then the all caching functionality will be complete disabled,
          #           takes precedence over all other caching options.
          skip-cache: true
