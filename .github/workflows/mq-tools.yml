name: MQ tools

on:
  pull_request:
    paths:
      - "client/mq/**"
      - "chain/mq/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile.mq"
      - "Dockerfile.mq.dockerignore"
      - "scripts/with-private-git.sh"
      - "scripts/prepare-mq-go-modules.sh"
      - "scripts/tests/test_mq_build.py"
      - ".github/workflows/mq-tools.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Source branch or tag (publishing requires an MQ release tag)"
        default: "ic-1047/data-pipeline"
        required: true
        type: string
      publish:
        description: "Publish the selected MQ release tag to GHCR"
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'release' || contains(github.event.release.tag_name, '-mq.')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test MQ tools
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python3 scripts/tests/test_mq_build.py
          ./scripts/with-private-git.sh go test -race ./client/mq/...

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          fetch-depth: 0
      - name: Select immutable source version
        id: source
        env:
          SHOULD_PUBLISH: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REQUESTED_REF: ${{ inputs.ref }}
        shell: bash
        run: |
          revision=$(git rev-parse HEAD)
          version="dev-${revision:0:12}"
          if [[ "$SHOULD_PUBLISH" == "true" ]]; then
            version="${RELEASE_TAG:-$REQUESTED_REF}"
            if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-mq\.[0-9]+$ ]]; then
              echo "Publishing requires an existing versioned MQ tag" >&2
              exit 1
            fi
            if [[ "$(git rev-parse "refs/tags/$version^{commit}")" != "$revision" ]]; then
              echo "Source revision does not match the requested release tag" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Prepare private Go modules without passing credentials to Docker
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: ./scripts/prepare-mq-go-modules.sh
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build image for smoke checks
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mq
          platforms: linux/amd64
          load: true
          push: false
          tags: sdk-go-mq:test
          build-args: |
            VERSION=${{ steps.source.outputs.version }}
            REVISION=${{ steps.source.outputs.revision }}
      - name: Check runtime binaries and non-root state directory
        run: |
          docker run --rm sdk-go-mq:test /usr/local/bin/mq-detector -help
          docker run --rm sdk-go-mq:test /usr/local/bin/mq-stream-server -help
          docker run --rm sdk-go-mq:test /bin/sh -ec 'test "$(id -u)" = 10001; touch /var/lib/mq/state-test'
      - name: Log in to GHCR
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture release image
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mq
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/injectivelabs/sdk-go-mq:${{ steps.source.outputs.version }}
          build-args: |
            VERSION=${{ steps.source.outputs.version }}
            REVISION=${{ steps.source.outputs.revision }}
