syntax = "proto3";
package injective.permissions.v1beta1;

import "gogoproto/gogo.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos/bank/v1beta1/bank.proto";

option go_package = "github.com/InjectiveLabs/injective-core/injective-chain/modules/permissions/types";

message EventSetVoucher {
  // The bech32 address of the voucher holder.
  string addr = 1;
  // The new voucher amount. A zero coin signals voucher deletion.
  cosmos.base.v1beta1.Coin voucher = 2 [ (gogoproto.nullable) = false ];
}

message EventPostHookLogs {
  // The 0x formatted address of the post hook smart contract
  string post_hook_address = 1;
  // logs
  repeated EventPostHookLog logs = 2;
}

message EventPostHookLog {
  // log topics
  repeated string topics = 1;
  // log data
  bytes data = 2;
}