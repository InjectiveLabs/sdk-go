syntax = "proto3";
package injective.exchange.v2;

import "gogoproto/gogo.proto";
import "amino/amino.proto";
import "cosmos_proto/cosmos.proto";
import "cosmos/base/v1beta1/coin.proto";

option go_package = "github.com/InjectiveLabs/injective-core/injective-chain/modules/exchange/types/v2";

// spot authz messages
message CreateSpotLimitOrderAuthz {
  option (amino.name) = "exchange/v2/CreateSpotLimitOrderAuthz";
  option (cosmos_proto.implements_interface) = "Authorization";
  // the subaccount ID
  string subaccount_id = 1;
  // the market IDs
  repeated string market_ids = 2;
}

message CreateSpotMarketOrderAuthz {
  option (amino.name) = "exchange/v2/CreateSpotMarketOrderAuthz";
  option (cosmos_proto.implements_interface) = "Authorization";
  // the subaccount ID
  string subaccount_id = 1;
  // the market IDs
  repeated string market_ids = 2;
}

message BatchCreateSpotLimitOrdersAuthz {
  option (amino.name) = "exchange/v2/BatchCreateSpotLimitOrdersAuthz";
  option (cosmos_proto.implements_interface) = "Authorization";
  // the subaccount ID
  string subaccount_id = 1;
  // the market IDs
  repeated string market_ids = 2;
}

message CancelSpotOrderAuthz {
  option (amino.name) = "exchange/v2/CancelSpotOrderAuthz";
  option (cosmos_proto.implements_interface) = "Authorization";
  // the subaccount ID
  string subaccount_id = 1;
  // the market IDs
  repeated string market_ids = 2;
}

message BatchCancelSpotOrdersAuthz {
  option (amino.name) = "exchange/v2/BatchCancelSpotOrdersAuthz";
  option (cosmos_proto.implements_interface) = "Authorization";
  // the subaccount ID
  string subaccount_id = 1;
  // the market IDs
  repeated string market_ids = 2;
}

// derivative authz messages
message CreateDerivativeLimitOrderAuthz {
  option (amino.name) = "exchange/v2/CreateDerivativeLimitOrderAuthz";
  option (cosmos_proto.implements_interface) = "Authorization";
  // the subaccount ID
  string subaccount_id = 1;
  // the market IDs
  repeated string market_ids = 2;
}

message CreateDerivativeMarketOrderAuthz {
  option (amino.name) = "exchange/v2/CreateDerivativeMarketOrderAuthz";
  option (cosmos_proto.implements_interface) = "Authorization";
  // the subaccount ID
  string subaccount_id = 1;
  // the market IDs
  repeated string market_ids = 2;
}

message BatchCreateDerivativeLimitOrdersAuthz {
  option (amino.name) = "exchange/v2/BatchCreateDerivativeLimitOrdersAuthz";
  option (cosmos_proto.implements_interface) = "Authorization";
  // the subaccount ID
  string subaccount_id = 1;
  // the market IDs
  repeated string market_ids = 2;
}

message CancelDerivativeOrderAuthz {
  option (amino.name) = "exchange/v2/CancelDerivativeOrderAuthz";
  option (cosmos_proto.implements_interface) = "Authorization";
  string subaccount_id = 1;
  repeated string market_ids = 2;
}

message BatchCancelDerivativeOrdersAuthz {
  option (amino.name) = "exchange/v2/BatchCancelDerivativeOrdersAuthz";
  option (cosmos_proto.implements_interface) = "Authorization";
  // the subaccount ID
  string subaccount_id = 1;
  // the market IDs
  repeated string market_ids = 2;
}

// common authz message used in both spot & derivative markets
message BatchUpdateOrdersAuthz {
  option (amino.name) = "exchange/v2/BatchUpdateOrdersAuthz";
  option (cosmos_proto.implements_interface) = "Authorization";
  // the subaccount ID
  string subaccount_id = 1;
  // the spot market IDs
  repeated string spot_markets = 2;
  // the derivative market IDs
  repeated string derivative_markets = 3;
}

// GenericExchangeAuthorization gives the grantee permissions to execute
// the provided Exchange method on behalf of the granter's account.
message GenericExchangeAuthorization {
  option (amino.name) = "exchange/v2/GenericExchangeAuthorization";
  option (cosmos_proto.implements_interface) = "Authorization";

  // Msg, identified by it's type URL, to grant permissions to the grantee
  string msg = 1;

  // SpendLimit is the maximum amount of tokens that the grantee can spend on
  // behalf of the granter. If empty, the grantee can only execute messages that
  // do not spend funds (e.g. cancellations). Spending is only metered for
  // messages dispatched through the EVM exchange precompile; any other dispatch
  // path (e.g. MsgExec) is restricted to messages that do not spend funds.
  repeated cosmos.base.v1beta1.Coin spend_limit = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true,
    (amino.encoding) = "legacy_coins",
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
}
