syntax = "proto3";
package injective.insurance.v1beta1;

import "gogoproto/gogo.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "injective/insurance/v1beta1/insurance.proto";
import "injective/oracle/v1beta1/oracle.proto";
import "amino/amino.proto";

option go_package = "github.com/InjectiveLabs/injective-core/injective-chain/modules/insurance/types";

// Msg defines the insurance Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // CreateInsuranceFund defines a method for creating an insurance fund
  rpc CreateInsuranceFund(MsgCreateInsuranceFund)
      returns (MsgCreateInsuranceFundResponse);

  // Underwrite defines a method for depositing tokens to underwrite an
  // insurance fund
  rpc Underwrite(MsgUnderwrite) returns (MsgUnderwriteResponse);

  // RequestRedemption defines a method for requesting a redemption of the
  // sender's insurance fund tokens
  rpc RequestRedemption(MsgRequestRedemption)
      returns (MsgRequestRedemptionResponse);

  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // ClaimVoucher defines a method for claiming an outstanding voucher
  rpc ClaimVoucher(MsgClaimVoucher) returns (MsgClaimVoucherResponse);

  // CreateConsolidatedInsurancePool creates an empty quote-denominated pool.
  rpc CreateConsolidatedInsurancePool(MsgCreateConsolidatedInsurancePool)
      returns (MsgCreateConsolidatedInsurancePoolResponse);

  // SetConsolidatedInsurancePoolPause controls the insurance-payout pause. It
  // disables fresh draws, underwriting, and market enrollment; it does not
  // halt enrolled markets, credits, or automatic redemptions. Set paused=false
  // to resume payouts.
  rpc SetConsolidatedInsurancePoolPause(MsgSetConsolidatedInsurancePoolPause)
      returns (MsgSetConsolidatedInsurancePoolPauseResponse);

  // UpdateConsolidatedInsurancePolicy changes one enrolled market's draw cap.
  rpc UpdateConsolidatedInsurancePolicy(
      MsgUpdateConsolidatedInsurancePolicy)
      returns (MsgUpdateConsolidatedInsurancePolicyResponse);

  // UnderwriteConsolidatedInsurancePool deposits quote and immediately mints
  // pool shares.
  rpc UnderwriteConsolidatedInsurancePool(
      MsgUnderwriteConsolidatedInsurancePool)
      returns (MsgUnderwriteConsolidatedInsurancePoolResponse);

  // RequestConsolidatedRedemption escrows shares for automatic redemption.
  rpc RequestConsolidatedRedemption(MsgRequestConsolidatedRedemption)
      returns (MsgRequestConsolidatedRedemptionResponse);
}

// MsgCreateInsuranceFund a message to create an insurance fund for a derivative
// market.
message MsgCreateInsuranceFund {
  option (amino.name) = "insurance/MsgCreateInsuranceFund";
  option (gogoproto.equal) = false;
  option (gogoproto.goproto_getters) = false;

  option (cosmos.msg.v1.signer) = "sender";

  // Creator of the insurance fund.
  string sender = 1;
  // Ticker for the derivative market.
  string ticker = 2;
  // Coin denom to use for the market quote denom
  string quote_denom = 3;
  // Oracle base currency of the derivative market OR the oracle symbol for the
  // binary options market.
  string oracle_base = 4;
  // Oracle quote currency of the derivative market OR the oracle provider for
  // the binary options market.
  string oracle_quote = 5;
  // Oracle type of the binary options or derivative market
  injective.oracle.v1beta1.OracleType oracle_type = 6;
  // Expiration time of the derivative market. Should be -1 for perpetual or -2
  // for binary options markets.
  int64 expiry = 7;
  // Initial deposit of the insurance fund
  cosmos.base.v1beta1.Coin initial_deposit = 8 [ (gogoproto.nullable) = false ];
}

message MsgCreateInsuranceFundResponse {}

// MsgUnderwrite defines a message for depositing coins to underwrite an
// insurance fund
message MsgUnderwrite {
  option (amino.name) = "insurance/MsgUnderwrite";
  option (gogoproto.equal) = false;
  option (gogoproto.goproto_getters) = false;

  option (cosmos.msg.v1.signer) = "sender";

  // Address of the underwriter.
  string sender = 1;
  // MarketID of the insurance fund.
  string market_id = 2;
  // Amount of quote_denom to underwrite the insurance fund.
  cosmos.base.v1beta1.Coin deposit = 3 [ (gogoproto.nullable) = false ];
}

message MsgUnderwriteResponse {}

// MsgRequestRedemption defines a message for requesting a redemption of the
// sender's insurance fund tokens
message MsgRequestRedemption {
  option (amino.name) = "insurance/MsgRequestRedemption";
  option (gogoproto.equal) = false;
  option (gogoproto.goproto_getters) = false;

  option (cosmos.msg.v1.signer) = "sender";

  // Address of the underwriter requesting a redemption.
  string sender = 1;
  // MarketID of the insurance fund.
  string market_id = 2;
  // Insurance fund share token amount to be redeemed.
  cosmos.base.v1beta1.Coin amount = 3 [ (gogoproto.nullable) = false ];
}

message MsgRequestRedemptionResponse {}

message MsgUpdateParams {
  option (amino.name) = "insurance/MsgUpdateParams";
  option (cosmos.msg.v1.signer) = "authority";

  // authority is the address of the governance account.
  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];

  // params defines the insurance parameters to update.
  //
  // NOTE: All parameters must be supplied.
  Params params = 2 [ (gogoproto.nullable) = false ];
}

message MsgUpdateParamsResponse {}

// MsgClaimVoucher defines a message for claiming an outstanding voucher
message MsgClaimVoucher {
  option (amino.name) = "insurance/MsgClaimVoucher";
  option (gogoproto.equal) = false;
  option (gogoproto.goproto_getters) = false;

  option (cosmos.msg.v1.signer) = "sender";

  // The sender's Injective address.
  string sender = 1;
  // The token denom of the voucher to claim.
  string denom = 2;
}

message MsgClaimVoucherResponse {}

// MsgCreateConsolidatedInsurancePool creates one empty exact-denom pool.
message MsgCreateConsolidatedInsurancePool {
  option (amino.name) = "insurance/MsgCreateConsolidatedInsurancePool";
  option (cosmos.msg.v1.signer) = "authority";

  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string deposit_denom = 2;
  uint32 quote_decimals = 3;
  string max_draw_per_market = 4 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  int64 redemption_notice_period_seconds = 5;
}

// MsgCreateConsolidatedInsurancePoolResponse is returned after pool creation.
message MsgCreateConsolidatedInsurancePoolResponse {}

// MsgSetConsolidatedInsurancePoolPause changes the insurance-payout pause. It
// is not a market-trading or cross-margin safety halt.
message MsgSetConsolidatedInsurancePoolPause {
  option (amino.name) = "insurance/MsgSetConsolidatedInsurancePoolPause";
  option (cosmos.msg.v1.signer) = "authority";

  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string deposit_denom = 2;
  bool paused = 3;
}

// MsgSetConsolidatedInsurancePoolPauseResponse is returned after a pause
// change.
message MsgSetConsolidatedInsurancePoolPauseResponse {}

// MsgUpdateConsolidatedInsurancePolicy changes one enrolled market's draw cap.
message MsgUpdateConsolidatedInsurancePolicy {
  option (amino.name) = "insurance/MsgUpdateConsolidatedInsurancePolicy";
  option (cosmos.msg.v1.signer) = "authority";

  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string market_id = 2;
  string max_draw = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
}

// MsgUpdateConsolidatedInsurancePolicyResponse confirms a policy-limit update.
message MsgUpdateConsolidatedInsurancePolicyResponse {}

// MsgUnderwriteConsolidatedInsurancePool deposits quote and mints shares
// immediately.
message MsgUnderwriteConsolidatedInsurancePool {
  option (amino.name) = "insurance/MsgUnderwriteConsolidatedInsurancePool";
  option (gogoproto.equal) = false;
  option (gogoproto.goproto_getters) = false;
  option (cosmos.msg.v1.signer) = "sender";

  string sender = 1;
  cosmos.base.v1beta1.Coin deposit = 2 [ (gogoproto.nullable) = false ];
  string min_shares_out = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
}

// MsgUnderwriteConsolidatedInsurancePoolResponse reports the shares minted.
message MsgUnderwriteConsolidatedInsurancePoolResponse {
  cosmos.base.v1beta1.Coin shares = 1 [ (gogoproto.nullable) = false ];
}

// MsgRequestConsolidatedRedemption escrows shares for automatic redemption.
message MsgRequestConsolidatedRedemption {
  option (amino.name) = "insurance/MsgRequestConsolidatedRedemption";
  option (gogoproto.equal) = false;
  option (gogoproto.goproto_getters) = false;
  option (cosmos.msg.v1.signer) = "sender";

  string sender = 1;
  string pool_denom = 2;
  cosmos.base.v1beta1.Coin shares = 3 [ (gogoproto.nullable) = false ];
}

// MsgRequestConsolidatedRedemptionResponse reports the assigned schedule ID.
message MsgRequestConsolidatedRedemptionResponse { uint64 schedule_id = 1; }
