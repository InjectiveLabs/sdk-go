syntax = "proto3";
package injective.insurance.v1beta1;

import "gogoproto/gogo.proto";
import "cosmos/base/v1beta1/coin.proto";
import "injective/insurance/v1beta1/insurance.proto";

option go_package = "github.com/InjectiveLabs/injective-core/injective-chain/modules/insurance/types";

message EventInsuranceFundUpdate { InsuranceFund fund = 1; }

message EventRequestRedemption { RedemptionSchedule schedule = 1; }

message EventWithdrawRedemption {
  // redemption schedule triggered withdraw
  RedemptionSchedule schedule = 1;
  // redeem coin amount in base_currency
  cosmos.base.v1beta1.Coin redeem_coin = 2 [ (gogoproto.nullable) = false ];
}

message EventWithdrawRedemptionFailed {
  // redemption schedule that failed to withdraw
  RedemptionSchedule schedule = 1;
  // error produced while processing the redemption withdrawal
  string withdraw_err = 2;
}

message EventUnderwrite {
  // address of the underwriter
  string underwriter = 1;
  // marketId of insurance fund for the redemption
  string marketId = 2;
  // deposit coin amount
  cosmos.base.v1beta1.Coin deposit = 3 [ (gogoproto.nullable) = false ];
  // share coin amount
  cosmos.base.v1beta1.Coin shares = 4 [ (gogoproto.nullable) = false ];
}

message EventInsuranceWithdraw {
  string market_id = 1;
  string market_ticker = 2;
  cosmos.base.v1beta1.Coin withdrawal = 3 [ (gogoproto.nullable) = false ];
}

message EventSetVoucher {
  // The bech32 address of the voucher holder.
  string addr = 1;
  // The new voucher amount. A zero coin signals voucher deletion.
  cosmos.base.v1beta1.Coin voucher = 2 [
    (gogoproto.customtype) = "github.com/cosmos/cosmos-sdk/types.Coin",
    (gogoproto.nullable) = false
  ];
}

// EventConsolidatedInsurancePoolCreated records governance pool creation.
message EventConsolidatedInsurancePoolCreated {
  ConsolidatedInsurancePool pool = 1 [ (gogoproto.nullable) = false ];
}

// EventConsolidatedInsurancePoolPauseChanged records an insurance-payout pause
// change. It does not signal a market-trading halt.
message EventConsolidatedInsurancePoolPauseChanged {
  string deposit_denom = 1;
  bool paused = 2;
}

// EventConsolidatedInsuranceMarketEnrolled records a market being bound to
// consolidated insurance.
message EventConsolidatedInsuranceMarketEnrolled {
  ConsolidatedInsurancePolicy policy = 1 [ (gogoproto.nullable) = false ];
}

// EventConsolidatedInsurancePolicyUpdated records a governance draw-cap change.
message EventConsolidatedInsurancePolicyUpdated {
  ConsolidatedInsurancePolicy policy = 1 [ (gogoproto.nullable) = false ];
}

// EventConsolidatedInsuranceUnderwrite records an immediate deposit and share
// mint.
message EventConsolidatedInsuranceUnderwrite {
  string underwriter = 1;
  cosmos.base.v1beta1.Coin deposit = 2 [ (gogoproto.nullable) = false ];
  cosmos.base.v1beta1.Coin shares = 3 [ (gogoproto.nullable) = false ];
}

// EventConsolidatedInsuranceRedemptionRequested records a new automatic
// redemption.
message EventConsolidatedInsuranceRedemptionRequested {
  ConsolidatedRedemptionSchedule schedule = 1 [ (gogoproto.nullable) = false ];
}

// EventConsolidatedInsuranceRedemptionProcessed records an automatic payout.
message EventConsolidatedInsuranceRedemptionProcessed {
  ConsolidatedRedemptionSchedule schedule = 1 [ (gogoproto.nullable) = false ];
  cosmos.base.v1beta1.Coin payout = 2 [ (gogoproto.nullable) = false ];
  bool voucher_created = 3;
}

// EventConsolidatedInsuranceRedemptionRetry records a failed automatic payout
// and the deferred schedule that will be retried.
message EventConsolidatedInsuranceRedemptionRetry {
  ConsolidatedRedemptionSchedule schedule = 1 [ (gogoproto.nullable) = false ];
  string retry_error = 2;
}

// EventConsolidatedInsuranceBalanceChanged records a market draw or repayment.
message EventConsolidatedInsuranceBalanceChanged {
  string market_id = 1;
  string pool_denom = 2;
  // amount is the applied balance change and is retained for compatibility.
  cosmos.base.v1beta1.Coin amount = 3 [ (gogoproto.nullable) = false ];
  bool is_draw = 4;
  cosmos.base.v1beta1.Coin requested_amount = 5
      [ (gogoproto.nullable) = false ];
  cosmos.base.v1beta1.Coin paid_amount = 6
      [ (gogoproto.nullable) = false ];
  cosmos.base.v1beta1.Coin unpaid_amount = 7
      [ (gogoproto.nullable) = false ];
  cosmos.base.v1beta1.Coin remaining_pool_balance = 8
      [ (gogoproto.nullable) = false ];
  cosmos.base.v1beta1.Coin remaining_market_capacity = 9
      [ (gogoproto.nullable) = false ];
}

// EventConsolidatedReservationReallocated records deposited quote collateral
// moving into the same cross position's margin, without an insurance payment.
message EventConsolidatedReservationReallocated {
  string market_id = 1;
  string subaccount_id = 2;
  string quote_denom = 3;
  // Exact quote amount moved, in chain units.
  string amount = 4 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
}
